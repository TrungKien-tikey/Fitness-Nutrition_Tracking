services:
  # 1. MySQL database
  fitness-db:
    image: mysql:8.0
    container_name: fitness-mysql-container
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123}
      MYSQL_DATABASE: fitness_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Run init-db.sql on first startup
      - ./src/main/resources/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - fitness-network

  # 2. phpMyAdmin
  fitness-phpmyadmin:
    image: phpmyadmin:latest
    container_name: fitness-phpmyadmin-container
    environment:
      PMA_HOST: fitness-db
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123}
    ports:
      - "8085:80"
    depends_on:
      - fitness-db
    networks:
      - fitness-network

  # 3. Spring Boot backend
  fitness-app:
    build: .
    container_name: fitness-backend-container
    ports:
      - "8081:8081"
    environment:
      # Point to the MySQL container instead of localhost
      SPRING_DATASOURCE_URL: jdbc:mysql://fitness-db:3306/fitness_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
    depends_on:
      - fitness-db
    networks:
      - fitness-network

volumes:
  mysql_data:

networks:
  fitness-network:
    driver: bridge
